<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PISI · Hardware Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0e;
    --bg-2: #15151a;
    --bg-3: #1c1c22;
    --border: #28282f;
    --border-bright: #3a3a44;
    --text: #e8e4d8;
    --text-mute: #8a877e;
    --text-dim: #5a5852;
    --amber: #d4823a;
    --amber-bright: #ffb86b;
    --amber-glow: rgba(255, 184, 107, 0.4);
    --power: #c64545;
    --power-glow: rgba(198, 69, 69, 0.35);
    --gnd: #44443f;
    --gpio: #5a5852;
    --wire-orange: #d4823a;
    --wire-black: #4a4844;
    --wire-red: #c64545;
    --wire-yellow: #d4b13a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(212, 130, 58, 0.06) 0%, transparent 35%),
      radial-gradient(circle at 85% 80%, rgba(95, 179, 217, 0.04) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13, 13, 14, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }
  .brand .logo {
    color: var(--amber);
    font-size: 18px;
  }
  .brand .name {
    font-size: 16px;
    color: var(--text);
  }
  .brand .sub {
    color: var(--text-mute);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    border-left: 1px solid var(--border-bright);
    padding-left: 12px;
  }

  .step-selector {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .step-selector button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-mute);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 150ms ease;
  }
  .step-selector button:hover:not(:disabled) {
    border-color: var(--border-bright);
    color: var(--text);
  }
  .step-selector button.active {
    background: var(--amber);
    color: #1a1208;
    border-color: var(--amber);
    font-weight: 700;
  }
  .step-selector button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .step-selector button .stub {
    color: var(--text-dim);
    font-style: italic;
    margin-left: 4px;
  }

  main {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 0;
    position: relative;
    z-index: 1;
  }
  @media (max-width: 880px) {
    main { grid-template-columns: 1fr; }
  }

  /* ============ PIN PANEL (left, sticky) ============ */
  .pin-panel {
    border-right: 1px solid var(--border);
    padding: 24px;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    background: var(--bg);
  }
  @media (max-width: 880px) {
    .pin-panel { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
  }

  .panel-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--text-mute);
    margin-bottom: 4px;
  }
  .panel-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 18px;
  }
  .panel-meta span { color: var(--amber); }

  .pi-board {
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 14px 12px 16px;
    margin-bottom: 18px;
    position: relative;
  }
  .pi-board::before {
    content: '';
    position: absolute;
    top: -1px;
    left: 12px;
    width: 30px;
    height: 2px;
    background: var(--amber);
  }
  .pi-board-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-mute);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .pi-board-label .pin1-marker {
    color: var(--amber);
  }

  .pin-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 0;
    font-size: 11px;
  }

  .pin-row {
    display: contents;
  }
  .pin-cell {
    display: flex;
    align-items: center;
    padding: 4px 6px;
    cursor: pointer;
    transition: background 100ms ease;
    user-select: none;
    border: 1px solid transparent;
    line-height: 1.3;
  }
  .pin-cell:hover {
    background: var(--bg-3);
  }
  .pin-cell.left {
    justify-content: flex-end;
    text-align: right;
    flex-direction: row;
  }
  .pin-cell.right {
    justify-content: flex-start;
    flex-direction: row-reverse;
  }
  .pin-cell .num {
    color: var(--text-dim);
    font-weight: 500;
    min-width: 18px;
    text-align: center;
  }
  .pin-cell .label {
    margin: 0 8px;
    font-weight: 500;
  }
  .pin-cell.left .label { color: var(--gpio); }
  .pin-cell.right .label { color: var(--gpio); }

  .pin-cell[data-type="power"] .label { color: var(--power); }
  .pin-cell[data-type="gnd"] .label { color: var(--text-mute); }

  .pin-cell .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--gpio);
    flex-shrink: 0;
  }
  .pin-cell[data-type="power"] .dot { background: var(--power); }
  .pin-cell[data-type="gnd"] .dot { background: var(--gnd); }

  .pin-cell.active {
    background: rgba(212, 130, 58, 0.08);
    border-color: var(--amber);
  }
  .pin-cell.active .label {
    color: var(--amber-bright) !important;
    text-shadow: 0 0 8px var(--amber-glow);
  }
  .pin-cell.active .dot {
    background: var(--amber-bright);
    box-shadow: 0 0 10px var(--amber-glow);
    animation: pulse 2s ease-in-out infinite;
  }
  .pin-cell.selected {
    background: var(--bg-3);
    border-color: var(--border-bright);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .pin-divider {
    width: 1px;
    background: var(--border);
    margin: 0 4px;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 10px;
    color: var(--text-mute);
    margin-bottom: 18px;
    padding: 10px 12px;
    background: var(--bg-2);
    border: 1px solid var(--border);
  }
  .legend .key {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .legend .key::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gpio);
  }
  .legend .key.power::before { background: var(--power); }
  .legend .key.gnd::before { background: var(--gnd); }
  .legend .key.active::before { background: var(--amber-bright); box-shadow: 0 0 6px var(--amber-glow); }

  .pin-info {
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 14px;
    min-height: 88px;
    font-size: 12px;
  }
  .pin-info .info-empty {
    color: var(--text-dim);
    font-style: italic;
    text-align: center;
    padding: 14px 0;
  }
  .pin-info .info-pin {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .pin-info .info-pin .num {
    background: var(--bg-3);
    color: var(--amber);
    padding: 2px 8px;
    font-weight: 700;
    font-size: 11px;
  }
  .pin-info .info-pin .lbl {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }
  .pin-info .info-pin .typ {
    color: var(--text-mute);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-left: auto;
  }
  .pin-info .info-role {
    color: var(--text-mute);
    font-size: 11px;
    line-height: 1.5;
  }
  .pin-info .info-role strong {
    color: var(--amber);
    font-weight: 500;
  }
  .pin-info .info-unused {
    color: var(--text-dim);
    font-style: italic;
    font-size: 11px;
  }

  /* ============ STEP PANEL (right) ============ */
  .step-panel {
    padding: 32px 36px 80px;
    max-width: 780px;
  }

  .step-head {
    margin-bottom: 32px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0 20px;
    align-items: baseline;
  }
  .step-head .num {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 64px;
    line-height: 1;
    color: var(--amber);
    font-weight: 400;
    grid-row: 1 / 3;
  }
  .step-head h1 {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 38px;
    font-weight: 400;
    line-height: 1.1;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .step-head .tag {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--text-mute);
    margin-bottom: 8px;
  }
  .step-head .desc {
    color: var(--text-mute);
    font-size: 13px;
    margin-top: 14px;
    max-width: 60ch;
  }

  .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--amber);
    margin: 32px 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-title::before {
    content: '';
    width: 4px;
    height: 4px;
    background: var(--amber);
    border-radius: 50%;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .wiring {
    list-style: none;
    counter-reset: wiring;
  }
  .wiring li {
    counter-increment: wiring;
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    align-items: start;
  }
  .wiring li:last-child { border-bottom: none; }
  .wiring li::before {
    content: counter(wiring, decimal-leading-zero);
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 500;
    padding-top: 2px;
  }
  .wiring .conn {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .wiring .from, .wiring .to {
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .wiring .from { color: var(--text); }
  .wiring .to { color: var(--text-mute); }
  .wiring .arrow {
    color: var(--text-dim);
    font-size: 14px;
  }
  .wiring .wire {
    margin-left: auto;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 8px;
    border: 1px solid currentColor;
  }
  .wire.orange { color: var(--wire-orange); }
  .wire.black { color: var(--text-mute); }
  .wire.red { color: var(--wire-red); }
  .wire.yellow { color: var(--wire-yellow); }
  .wire.none { color: var(--text-dim); border-style: dashed; }

  .wiring .note {
    grid-column: 2;
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 6px;
    padding-left: 2px;
  }

  .code-block {
    background: var(--bg-2);
    border: 1px solid var(--border);
    margin-top: 8px;
  }
  .code-block header {
    background: var(--bg-3);
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 8px 14px;
    position: static;
    backdrop-filter: none;
    font-size: 11px;
    color: var(--text-mute);
    display: flex;
    align-items: center;
    gap: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .code-block header::before {
    content: '$';
    color: var(--amber);
    font-weight: 700;
  }
  .code-block pre {
    padding: 16px;
    overflow-x: auto;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
  }
  .code-block .kw { color: #c678dd; }
  .code-block .fn { color: var(--amber-bright); }
  .code-block .num { color: #d19a66; }
  .code-block .str { color: #98c379; }
  .code-block .com { color: var(--text-dim); font-style: italic; }

  .checks {
    list-style: none;
    margin-top: 4px;
  }
  .checks li {
    padding: 10px 0;
    border-bottom: 1px dashed var(--border);
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 12px;
    font-size: 12px;
  }
  .checks li:last-child { border-bottom: none; }
  .checks li::before {
    content: '◇';
    color: var(--amber);
    font-size: 14px;
  }
  .checks li b {
    color: var(--text);
    font-weight: 500;
    display: block;
    margin-bottom: 2px;
  }
  .checks li span {
    color: var(--text-mute);
  }

  .troubleshoot {
    border: 1px solid var(--border);
    margin-top: 4px;
  }
  .troubleshoot div {
    display: grid;
    grid-template-columns: 1fr 2fr;
    border-bottom: 1px solid var(--border);
  }
  .troubleshoot div:last-child { border-bottom: none; }
  .troubleshoot .head {
    background: var(--bg-2);
    color: var(--amber);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    padding: 8px 14px;
    border-right: 1px solid var(--border);
  }
  .troubleshoot .symptom {
    padding: 12px 14px;
    color: var(--text);
    font-size: 12px;
    border-right: 1px solid var(--border);
    background: var(--bg-2);
  }
  .troubleshoot .fix {
    padding: 12px 14px;
    color: var(--text-mute);
    font-size: 12px;
  }

  .placeholder {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    border: 1px dashed var(--border);
  }
  .placeholder .ph-num {
    font-family: 'Instrument Serif', serif;
    font-size: 80px;
    line-height: 1;
    color: var(--text-dim);
    opacity: 0.4;
  }
  .placeholder p {
    margin-top: 12px;
    font-size: 12px;
  }
  .placeholder .ph-soon {
    color: var(--amber);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    margin-top: 18px;
  }

  footer {
    grid-column: 1 / -1;
    padding: 20px 36px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  footer .pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--amber);
    border-radius: 50%;
    margin-right: 8px;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 8px var(--amber-glow);
  }

  /* ============ CIRCUIT DIAGRAM ============ */
  .circuit-frame {
    background: #0a0a0c;
    border: 1px solid var(--border);
    padding: 24px 16px;
    margin: 12px 0;
    overflow-x: auto;
  }
  .circuit-frame svg {
    width: 100%;
    height: auto;
    min-width: 540px;
    display: block;
  }

  /* SVG component styling */
  .c-box { fill: #15151a; stroke: #3a3a44; stroke-width: 1; }
  .c-box-pi { fill: #0d2540; stroke: #2a5a8c; }
  .c-box-relay { fill: #1a0d2c; stroke: #5a3a6c; }
  .c-box-power { fill: #2a1a08; stroke: #6c4520; }
  .c-box-load { fill: #2a0c0c; stroke: #6c2828; }

  .c-label { fill: #e8e4d8; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 500; }
  .c-label-bold { fill: #e8e4d8; font-size: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.05em; }
  .c-label-mute { fill: #8a877e; font-size: 10px; font-family: 'JetBrains Mono', monospace; }
  .c-label-amber { fill: #ffb86b; font-size: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .c-label-power { fill: #e87878; font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 600; }
  .c-label-gnd { fill: #888780; font-size: 11px; font-family: 'JetBrains Mono', monospace; }

  .pin-dot { stroke-width: 0.5; stroke: #0a0a0c; }
  .pin-dot-power { fill: #c64545; }
  .pin-dot-gnd { fill: #5a5852; }
  .pin-dot-gpio { fill: #d4b13a; }
  .pin-dot-12v { fill: #d4823a; }
  .pin-dot-out { fill: #d85a30; }

  .wire { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .wire-red { stroke: #c64545; }
  .wire-black { stroke: #5a5852; }
  .wire-yellow { stroke: #d4b13a; }
  .wire-orange { stroke: #d4823a; }
  .wire-coral { stroke: #d85a30; }
  .wire-existing { opacity: 0.35; stroke-dasharray: 4 3; }

  .term-screw { fill: #88826c; stroke: #5a5852; stroke-width: 0.5; }

  /* ============ COMPONENT GALLERY ============ */
  .component-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 8px;
    margin: 8px 0 16px;
  }
  .comp-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .comp-card .comp-svg {
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .comp-card .comp-svg svg {
    max-width: 100%;
    max-height: 80px;
  }
  .comp-card .comp-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    margin-top: 4px;
  }
  .comp-card .comp-detail {
    font-size: 10px;
    color: var(--text-mute);
    line-height: 1.4;
  }
  .comp-card .comp-warn {
    font-size: 10px;
    color: var(--amber);
    margin-top: 2px;
  }

  /* ============ STEP-BY-STEP MICRO ============ */
  .micro-steps {
    list-style: none;
    counter-reset: micro;
    margin: 8px 0;
    border-left: 1px solid var(--border-bright);
    padding-left: 0;
  }
  .micro-steps li {
    counter-increment: micro;
    padding: 14px 0 14px 44px;
    position: relative;
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
    border-bottom: 1px dashed var(--border);
  }
  .micro-steps li:last-child { border-bottom: none; }
  .micro-steps li::before {
    content: counter(micro, decimal-leading-zero);
    position: absolute;
    left: -16px;
    top: 12px;
    background: var(--bg);
    color: var(--amber);
    font-size: 10px;
    font-weight: 700;
    width: 32px;
    text-align: center;
    border: 1px solid var(--amber);
    padding: 3px 0;
    letter-spacing: 0.05em;
  }
  .micro-steps li b { color: var(--amber-bright); font-weight: 600; }
  .micro-steps li code {
    background: var(--bg-3);
    color: var(--amber-bright);
    padding: 1px 6px;
    font-size: 11px;
    border: 1px solid var(--border);
  }
  .micro-steps li .sub-note {
    color: var(--text-mute);
    font-size: 11px;
    display: block;
    margin-top: 4px;
    font-style: italic;
  }

  /* ============ CALLOUT (warnings, info) ============ */
  .callout {
    border-left: 3px solid var(--amber);
    background: rgba(212, 130, 58, 0.06);
    padding: 12px 14px;
    margin: 14px 0;
    font-size: 12px;
    color: var(--text);
  }
  .callout.danger {
    border-left-color: var(--power);
    background: rgba(198, 69, 69, 0.08);
  }
  .callout .callout-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--amber);
    font-weight: 700;
    margin-bottom: 4px;
  }
  .callout.danger .callout-title { color: var(--power); }

// ====================================================================
// RENDER PIN GRID
// ====================================================================
function renderPins() {
  const grid = document.getElementById('pin-grid');
  grid.innerHTML = '';

  for (let i = 0; i < 40; i += 2) {
    const left = PINS[i];
    const right = PINS[i + 1];

    const lCell = document.createElement('div');
    lCell.className = 'pin-cell left';
    lCell.dataset.type = left[2];
    lCell.dataset.pin = left[0];
    lCell.innerHTML = `<span class="label">${left[1]}</span><span class="num">${left[0]}</span><span class="dot"></span>`;
    lCell.addEventListener('click', () => selectPin(left[0]));

    const divider = document.createElement('div');
    divider.className = 'pin-divider';

    const rCell = document.createElement('div');
    rCell.className = 'pin-cell right';
    rCell.dataset.type = right[2];
    rCell.dataset.pin = right[0];
    rCell.innerHTML = `<span class="label">${right[1]}</span><span class="num">${right[0]}</span><span class="dot"></span>`;
    rCell.addEventListener('click', () => selectPin(right[0]));

    grid.appendChild(lCell);
    grid.appendChild(divider);
    grid.appendChild(rCell);
  }
}

// ====================================================================
// PIN SELECTION + INFO
// ====================================================================
let selectedPin = null;

function selectPin(pinNum) {
  document.querySelectorAll('.pin-cell.selected').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll(`.pin-cell[data-pin="${pinNum}"]`).forEach(c => c.classList.add('selected'));
  selectedPin = pinNum;

  const pin = PINS[pinNum - 1];
  const role = PIN_ROLES[pinNum];
  const info = document.getElementById('pin-info');

  let roleHTML;
  if (role) {
    roleHTML = `<div class="info-role"><strong>${role.use}</strong> — ${role.detail}</div>`;
  } else if (pin[2] === 'power') {
    roleHTML = `<div class="info-role"><strong>Power rail</strong> — ${pin[1]} sürekli, doğrudan SoC regülatöründen.</div>`;
  } else if (pin[2] === 'gnd') {
    roleHTML = `<div class="info-role"><strong>Ground</strong> — ortak toprak. Tüm GND pinleri Pi içinde birbirine bağlı.</div>`;
  } else {
    roleHTML = `<div class="info-unused">Bu projede henüz kullanılmıyor — yedek GPIO.</div>`;
  }

  const typeLabel = pin[2] === 'power' ? 'POWER' : pin[2] === 'gnd' ? 'GROUND' : 'GPIO';

  info.innerHTML = `
    <div class="info-pin">
      <span class="num">Pin ${pin[0]}</span>
      <span class="lbl">${pin[1]}</span>
      <span class="typ">${typeLabel}</span>
    </div>
    ${roleHTML}
  `;
}

// ====================================================================
// HIGHLIGHT ACTIVE PINS FOR CURRENT STEP
// ====================================================================
function highlightActivePins(pinList) {
  document.querySelectorAll('.pin-cell.active').forEach(c => c.classList.remove('active'));
  pinList.forEach(p => {
    document.querySelectorAll(`.pin-cell[data-pin="${p}"]`).forEach(c => c.classList.add('active'));
  });
}

// ====================================================================
// SYNTAX HIGHLIGHT — minimal Python
// ====================================================================
function highlightPython(code) {
  return code
    .replace(/(#[^\n]*)/g, '<span class="com">$1</span>')
    .replace(/\b(from|import|for|in|range|while|if|else)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(LED|sleep|range)\b/g, '<span class="fn">$1</span>')
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>');
}

// ====================================================================
// RENDER STEP
// ====================================================================
function renderStep(stepNum) {
  const step = STEPS[stepNum];
  const panel = document.getElementById('step-panel');

  if (!step) {
    panel.innerHTML = `<div class="placeholder"><div class="ph-num">${String(stepNum).padStart(2, '0')}</div><p>Bu adım henüz yok.</p></div>`;
    highlightActivePins([]);
    return;
  }

  if (step.placeholder) {
    panel.innerHTML = `
      <div class="step-head">
        <span class="num">${String(stepNum).padStart(2, '0')}</span>
        <div>
          <div class="tag">${step.tag}</div>
          <h1>${step.title}</h1>
          <p class="desc">${step.desc}</p>
        </div>
      </div>
      <div class="placeholder">
        <div class="ph-num">${String(stepNum).padStart(2, '0')}</div>
        <p>Bu adımın detaylı kablolama planı, Adım ${stepNum - 1} doğrulandığında buraya gelecek.</p>
        <div class="ph-soon">soon</div>
      </div>
    `;
    highlightActivePins(step.activePins || []);
    return;
  }

  let wiringHTML = '';
  step.wiring.forEach(w => {
    wiringHTML += `
      <li>
        <div>
          <div class="conn">
            <span class="from">${w.from}</span>
            <span class="arrow">→</span>
            <span class="to">${w.to}</span>
            <span class="wire ${w.wire}">${w.wireLabel}</span>
          </div>
          ${w.note ? `<div class="note">${w.note}</div>` : ''}
        </div>
      </li>
    `;
  });

  let checksHTML = '';
  step.checks.forEach(c => {
    checksHTML += `<li><div><b>${c.title}</b><span>${c.detail}</span></div></li>`;
  });

  let tsHTML = '<div class="head">belirti</div><div class="head">çözüm</div>';
  step.troubleshoot.forEach(t => {
    tsHTML += `<div><div class="symptom">${t.symptom}</div><div class="fix">${t.fix}</div></div>`;
  });
  // wrap as separate row pairs
  let tsRowsHTML = '';
  step.troubleshoot.forEach(t => {
    tsRowsHTML += `<div><div class="symptom">${t.symptom}</div><div class="fix">${t.fix}</div></div>`;
  });

  panel.innerHTML = `
    <div class="step-head">
      <span class="num">${String(stepNum).padStart(2, '0')}</span>
      <div>
        <div class="tag">${step.tag}</div>
        <h1>${step.title}</h1>
        <p class="desc">${step.desc}</p>
      </div>
    </div>

    ${step.diagram ? `
      <div class="section-title">devre şeması</div>
      <div class="circuit-frame">${step.diagram}</div>
    ` : ''}

    <div class="section-title">kablolama</div>
    <ol class="wiring">${wiringHTML}</ol>

    <div class="section-title">test kodu</div>
    <div class="code-block">
      <header>${step.code.file}</header>
      <pre><code>${highlightPython(step.code.content)}</code></pre>
    </div>

    <div class="section-title">doğrulama kontrolleri</div>
    <ul class="checks">${checksHTML}</ul>

    <div class="section-title">sorun giderme</div>
    <div class="troubleshoot">
      <div><div class="head">belirti</div><div class="head">çözüm</div></div>
      ${tsRowsHTML}
    </div>
  `;

  highlightActivePins(step.activePins || []);
}

// ====================================================================
// STEP SELECTOR
// ====================================================================
document.getElementById('step-selector').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || btn.disabled) return;
  document.querySelectorAll('.step-selector button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const step = parseInt(btn.dataset.step, 10);
  renderStep(step);
});

// ====================================================================
// INIT
// ====================================================================
renderPins();
renderStep(4);
// Update active button
document.querySelectorAll('.step-selector button').forEach(b => b.classList.remove('active'));
document.querySelector('.step-selector button[data-step="4"]').classList.add('active');
</script>
