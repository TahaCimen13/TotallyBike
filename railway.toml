[build]
builder = "nixpacks"
buildCommand = "npm install --legacy-peer-deps && npm run build --workspace=apps/api && npx prisma generate --schema=apps/api/prisma/schema.prisma"

[deploy]
startCommand = "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
