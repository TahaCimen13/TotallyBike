[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = [
  "npm run build --workspace=apps/api",
  "npx prisma generate --schema=apps/api/prisma/schema.prisma"
]

[start]
cmd = "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && node apps/api/dist/index.js"
